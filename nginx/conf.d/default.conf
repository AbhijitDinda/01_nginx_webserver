# ==============================================================
# default.conf — Nginx Server Block (Virtual Host)
# Location inside container: /etc/nginx/conf.d/default.conf
# This is the "virtual host" configuration for our website
# ==============================================================

server {

    # ── LISTENING CONFIGURATION ───────────────────────────────
    # listen 80: Accept connections on port 80 (HTTP)
    # IPv4 socket
    listen 80;

    # IPv6 socket — important for dual-stack environments
    listen [::]:80;

    # server_name: Which hostnames this server block handles
    # _ is a wildcard that matches anything
    # This means: handle requests for any hostname or IP that
    # reaches this Nginx instance
    server_name _;

    # ── ROOT AND INDEX ────────────────────────────────────────
    # root: The filesystem directory that maps to URL /
    # When browser requests GET /index.html
    # Nginx looks for: /usr/share/nginx/html/index.html
    root   /usr/share/nginx/html;

    # index: Default files to serve when a directory is requested
    # Browser requests GET /  → Nginx tries index.html first
    index  index.html index.htm;


    # ── LOCATION BLOCKS ───────────────────────────────────────
    # Location blocks define how to handle specific URL patterns
    # Priority (highest to lowest):
    #   1. = (exact match)
    #   2. ^~ (prefix, stops regex search)
    #   3. ~ and ~* (regex)
    #   4. (prefix, longest match wins)


    # ── ROOT — Serve Homepage ─────────────────────────────────
    location / {
        # try_files checks each file/directory in order:
        # $uri       → try exact file (/about.html → about.html)
        # $uri/      → try as directory (/ → index.html via `index` directive)
        # =404       → if none found, return 404 (triggers error_page below)
        try_files $uri $uri/ =404;
    }


    # ── CSS FILES ────────────────────────────────────────────
    location ~* \.css$ {
        # Regex: matches any URL ending in .css (case-insensitive)
        try_files $uri =404;

        # Cache CSS for 30 days
        # Browser won't request this file again for 30 days
        # Change filename (style.v2.css) to bust cache when updating
        expires 30d;

        # Cache-Control header
        # public: can be cached by CDN/proxies too
        # no-transform: don't modify/compress the file further
        add_header Cache-Control "public, no-transform";

        # Log access to CSS files (optional: set to off to reduce log noise)
        access_log off;
    }


    # ── JAVASCRIPT FILES ─────────────────────────────────────
    location ~* \.js$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }


    # ── IMAGE FILES ──────────────────────────────────────────
    # Matches .png, .jpg, .jpeg, .gif, .ico, .webp, .svg
    location ~* \.(png|jpg|jpeg|gif|ico|webp|svg)$ {
        try_files $uri =404;

        # Images rarely change — cache for 90 days
        expires 90d;
        add_header Cache-Control "public, no-transform";

        # Don't log image requests (reduces noise in access log)
        access_log off;

        # Don't log 404 for missing images
        # Useful if some images are optional/placeholders
        log_not_found off;
    }


    # ── PDF AND DOCUMENT FILES ───────────────────────────────
    location ~* \.(pdf|doc|docx|xls|xlsx|ppt|pptx|zip)$ {
        try_files $uri =404;

        # Cache documents for 7 days
        expires 7d;
        add_header Cache-Control "public, no-transform";

        # inline: PDF opens in browser's PDF viewer
        # Change to "attachment" to force download instead
        add_header Content-Disposition "inline";
    }


    # ── FONT FILES ───────────────────────────────────────────
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, no-transform";

        # CORS header for fonts (required by some browsers)
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }


    # ── FAVICON ──────────────────────────────────────────────
    # Exact match for favicon.ico
    location = /favicon.ico {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public";
        # Don't log favicon requests and missing favicon
        log_not_found off;
        access_log off;
    }


    # ── ROBOTS.TXT ───────────────────────────────────────────
    location = /robots.txt {
        try_files $uri =404;
        log_not_found off;
        access_log off;
    }


    # ── BLOCK HIDDEN FILES ────────────────────────────────────
    # Block access to any file/directory starting with a dot
    # Prevents access to .git, .env, .htaccess, .DS_Store, etc.
    # These should NEVER be exposed publicly
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }


    # ── BLOCK BACKUP AND TEMP FILES ───────────────────────────
    # Block common backup/temp file extensions
    # Prevents accidental exposure of sensitive files
    location ~* \.(bak|conf|dist|fla|inc|ini|log|psd|sh|sql|swp|tmp)$ {
        deny all;
    }


    # ── ERROR PAGES ───────────────────────────────────────────
    # Custom error pages for all error codes

    # 400 Bad Request: malformed HTTP request
    error_page 400 /400.html;

    # 401 Unauthorized: authentication required
    error_page 401 /401.html;

    # 403 Forbidden: valid request but access denied
    error_page 403 /403.html;

    # 404 Not Found: requested resource doesn't exist
    error_page 404 /404.html;

    # 408 Request Timeout
    error_page 408 /50x.html;

    # 500 Internal Server Error: generic server-side error
    # 502 Bad Gateway: invalid response from upstream (proxy)
    # 503 Service Unavailable: server overloaded or maintenance
    # 504 Gateway Timeout: upstream didn't respond in time
    error_page 500 502 503 504 /50x.html;

    # ── ERROR PAGE LOCATION BLOCKS ────────────────────────────
    # These serve the error HTML files

    # The 'internal' directive means these URLs can only be accessed
    # via Nginx internal redirects (error_page directive above)
    # Direct browser access to /404.html will work (no 'internal' here)
    # because we want to allow direct access for testing

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /400.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /401.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /403.html {
        root /usr/share/nginx/html;
        internal;
    }


    # ── ACCESS LOG FOR THIS SERVER ────────────────────────────
    # Override global access log for this server block
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;
}