# ==============================================================
# nginx.conf — Main Nginx Configuration
# Location inside container: /etc/nginx/nginx.conf
# ==============================================================

# ── USER ─────────────────────────────────────────────────────
# Nginx worker processes run as 'nginx' user
# Master process (root) binds to port 80, then drops privileges
# Workers run as nginx:nginx (user:group)
# SECURITY: Never run workers as root
user  nginx;

# ── WORKER PROCESSES ──────────────────────────────────────────
# auto = Nginx reads /proc/cpuinfo and spawns one worker per CPU core
# On t2.micro (1 vCPU): creates 1 worker process
# On t3.medium (2 vCPU): creates 2 worker processes
worker_processes  auto;

# ── ERROR LOG ────────────────────────────────────────────────
# Location: /var/log/nginx/error.log
# Levels (least to most verbose):
#   emerg > crit > error > warn > notice > info > debug
# 'warn' is production-appropriate — logs warnings and above
error_log  /var/log/nginx/error.log warn;

# ── PID FILE ─────────────────────────────────────────────────
# Stores the master process PID
# Used by init systems and scripts to send signals
# Example: kill -HUP $(cat /var/run/nginx.pid) → reload config
pid        /var/run/nginx.pid;

# ── WORKER RLIMIT ─────────────────────────────────────────────
# Maximum number of open file descriptors per worker
# Should be >= worker_connections
# Set this to prevent "too many open files" errors under load
worker_rlimit_nofile 65536;


# ══════════════════════════════════════════════════════════════
# EVENTS BLOCK
# Controls how Nginx handles connections at the OS level
# ══════════════════════════════════════════════════════════════
events {

    # Maximum simultaneous connections per worker process
    # Total max connections = worker_processes × worker_connections
    # On t2.micro: 1 worker × 1024 = 1024 max concurrent connections
    worker_connections  1024;

    # multi_accept on: worker accepts ALL pending connections at once
    # multi_accept off (default): worker accepts ONE connection per event
    # 'on' is better for high-traffic servers
    multi_accept on;

    # Connection method: epoll is Linux's most efficient event interface
    # Other options: select (old), poll (old), kqueue (BSD/macOS)
    # nginx auto-selects the best available, but explicit is clearer
    use epoll;
}


# ══════════════════════════════════════════════════════════════
# HTTP BLOCK
# All HTTP/HTTPS server configuration goes here
# ══════════════════════════════════════════════════════════════
http {

    # ── MIME TYPES ───────────────────────────────────────────
    # /etc/nginx/mime.types maps file extensions → Content-Type headers
    # Examples:
    #   .html → text/html
    #   .css  → text/css
    #   .js   → application/javascript
    #   .png  → image/png
    #   .pdf  → application/pdf
    include       /etc/nginx/mime.types;

    # Default Content-Type when extension is not in mime.types
    # application/octet-stream = binary download (safest default)
    default_type  application/octet-stream;

    # Charset for text responses
    charset utf-8;


    # ── LOGGING ──────────────────────────────────────────────
    # Define custom log format named 'main'
    # Variables:
    #   $remote_addr       = Client IP (e.g., 203.0.113.45)
    #   $remote_user       = Auth username (usually -)
    #   $time_local        = Request timestamp
    #   $request           = Full request line (method + URI + protocol)
    #   $status            = HTTP status code (200, 404, etc.)
    #   $body_bytes_sent   = Response body size in bytes
    #   $http_referer      = Previous page URL
    #   $http_user_agent   = Browser/client identification
    #   $request_time      = Time taken to process request in seconds
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time';

    # Access log: records every request
    access_log  /var/log/nginx/access.log  main;


    # ── PERFORMANCE: SENDFILE ─────────────────────────────────
    # sendfile on: use Linux sendfile() syscall for file transfers
    # Sends file directly from kernel file cache to socket buffer
    # Skips copying data through user space = much faster
    sendfile        on;

    # tcp_nopush: batch HTTP response headers + file into one TCP packet
    # Reduces number of TCP packets sent = lower latency
    # Only effective when sendfile is on
    tcp_nopush     on;

    # tcp_nodelay: disable Nagle's algorithm for keep-alive connections
    # Nagle's algorithm delays small packets to batch them
    # Disabling it reduces latency for interactive applications
    tcp_nodelay    on;


    # ── KEEP-ALIVE ────────────────────────────────────────────
    # Keep TCP connection open for 65 seconds after request
    # Allows browser to reuse connection for CSS, JS, images, etc.
    # Without keep-alive: browser would do TCP handshake for EVERY file
    # With keep-alive: one TCP connection serves all ~10 assets on homepage
    keepalive_timeout  65;

    # Maximum requests per keep-alive connection
    # After 100 requests, force connection close and open new one
    keepalive_requests 100;


    # ── TIMEOUTS ─────────────────────────────────────────────
    # client_header_timeout: max time to receive request headers
    client_header_timeout 12s;

    # client_body_timeout: max time between consecutive read operations
    client_body_timeout 12s;

    # send_timeout: max time between consecutive write operations to client
    send_timeout 10s;


    # ── CLIENT REQUEST LIMITS ─────────────────────────────────
    # client_max_body_size: max allowed size of client request body
    # We serve static files only, not accepting large uploads
    # 10MB is reasonable for form submissions
    client_max_body_size 10m;

    # Buffer for reading client request headers
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;


    # ── GZIP COMPRESSION ──────────────────────────────────────
    # Compress response body before sending to client
    # Reduces bandwidth by 60-80% for text files
    # Browser sends "Accept-Encoding: gzip" → Nginx compresses response
    # Browser decompresses transparently
    gzip  on;

    # Add Vary: Accept-Encoding header
    # Tells proxies/CDNs to cache both gzip and non-gzip versions
    gzip_vary on;

    # Compress responses for any client (proxy or direct)
    gzip_proxied any;

    # Compression level: 1 (fastest) to 9 (best compression)
    # Level 6 is the sweet spot — good compression, reasonable CPU
    gzip_comp_level 6;

    # Only compress files larger than 256 bytes
    # Small files: compression overhead > size savings
    gzip_min_length 256;

    # gzip buffer size
    gzip_buffers 16 8k;

    # Minimum HTTP version to use gzip with
    gzip_http_version 1.1;

    # File types to compress
    # NOTE: Do NOT add image/jpeg, image/png — they're already compressed
    # NOTE: Do NOT add application/pdf — PDFs are already compressed
    gzip_types
        text/plain
        text/html
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;


    # ── SECURITY: HIDE NGINX VERSION ──────────────────────────
    # server_tokens off prevents leaking Nginx version in:
    #   - Server header: "Server: nginx" (not "Server: nginx/1.25.3")
    #   - Error pages: removes version from footer
    # Security through obscurity — attackers can't target version-specific CVEs
    server_tokens off;


    # ── GLOBAL SECURITY HEADERS ───────────────────────────────
    # These headers are sent with EVERY response from this server

    # X-Frame-Options: Prevent your page from being embedded in iframes
    #   SAMEORIGIN = allow iframes from same origin only
    #   DENY = never allow iframes
    # Protects against clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;

    # X-Content-Type-Options: nosniff prevents browser from guessing MIME type
    # Without this, browser might interpret a .txt file as executable JS
    add_header X-Content-Type-Options "nosniff" always;

    # X-XSS-Protection: Enable browser's built-in XSS filter (legacy)
    # Modern browsers use CSP instead, but this helps older browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer-Policy: Controls what URL info is sent in Referer header
    # no-referrer-when-downgrade: send referrer on same-protocol requests
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Permissions-Policy: Restrict browser features
    # Disable camera, microphone, geolocation access from your pages
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;


    # ── INCLUDE SERVER BLOCKS ────────────────────────────────
    # Include all .conf files from /etc/nginx/conf.d/
    # Our server block is in conf.d/default.conf
    include /etc/nginx/conf.d/*.conf;
}