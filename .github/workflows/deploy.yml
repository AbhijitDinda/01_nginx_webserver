name: Build, Push & Deploy Nginx Web Server

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to EC2?'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nginx-webserver
  CONTAINER_NAME: nginx-webserver
  HOST_PORT: 80
  CONTAINER_PORT: 80

jobs:

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=build-${{ github.run_number }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'yes')

    environment:
      name: production
      url: http://${{ secrets.EC2_HOST }}

    steps:

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          script_stop: true
          script: |
            set -e

            echo "===== DEPLOYMENT STARTED ====="

            if ! command -v docker >/dev/null 2>&1; then
              echo "Installing Docker..."
              sudo dnf install -y docker || sudo yum install -y docker

              sudo systemctl enable docker
              sudo systemctl start docker

              sudo usermod -aG docker $USER
            fi

            sudo systemctl start docker

            sudo systemctl stop nginx 2>/dev/null || true
            sudo systemctl disable nginx 2>/dev/null || true

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/nginx-webserver:latest

            docker stop nginx-webserver 2>/dev/null || true
            docker rm nginx-webserver 2>/dev/null || true

            docker run -d \
              --name nginx-webserver \
              --restart unless-stopped \
              -p 80:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/nginx-webserver:latest

            echo "Waiting for container startup..."
            sleep 10

            curl -f http://localhost || exit 1

            docker image prune -af || true

            echo "===== DEPLOYMENT SUCCESSFUL ====="

      - name: Deployment Summary
        if: always()
        run: |
          echo "Application URL: http://${{ secrets.EC2_HOST }}"
